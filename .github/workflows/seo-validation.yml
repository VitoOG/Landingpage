name: SEO integrity
on:
  pull_request:
    branches: [feature/service-catalog-integration]
  push:
    branches: [feature/seo-entity-discovery-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_seo.py --site-root . --config seo/site-config.json
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
